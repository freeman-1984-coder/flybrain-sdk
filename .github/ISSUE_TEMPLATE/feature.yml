name: Feature proposal
description: Propose an integration or SDK improvement.
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to build?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and a small example
    validations:
      required: true
