name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: flybrain doctor
      - run: python examples/quickstart.py
      - run: python examples/demo_session.py tones --frames 50 --output demo-output
      - run: python -m build
      - run: python -m twine check dist/*
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,datasets]"
      - run: pytest tests/test_importers.py
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/browser_reference.py
      - run: python scripts/dodge_reference.py
      - run: npm ci && npm run build
        working-directory: packages/js
      - run: node scripts/build-browser-site.mjs
      - run: npm test
        working-directory: packages/js
      - run: pytest tests/test_experiment.py
      - run: git diff --exit-code -- site/js/runtime.js site/js/dodge-runtime.js site/toy-bundle.json site/license.txt
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download pinned Godot engine
        run: |
          curl --fail --location --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/flybrain-godot
      - name: Actual engine feedback and restart conformance
        run: python scripts/verify_godot.py /tmp/flybrain-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Actual engine disconnect and malformed-response checks
        run: python scripts/verify_godot_failures.py /tmp/flybrain-godot/Godot_v4.7.2-stable_linux.x86_64
